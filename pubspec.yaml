name: quizsnap
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_slidable: ^3.0.1
  flutter_card_swiper: ^3.0.1
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Security
  local_auth: ^2.1.8
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # AI (for Phase 2)
  groq: ^0.0.1
  
  # Document Processing (for Phase 2)
  file_picker: ^8.3.7
  syncfusion_flutter_pdf: ^24.2.8
  syncfusion_flutter_pdfviewer: ^24.2.8
  camera: ^0.10.5+5
  google_mlkit_text_recognition: ^0.11.0
  permission_handler: ^11.0.1
  
  # Utils
  intl: ^0.18.1
  crypto: ^3.0.3
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  
  # Export & Backup
  pdf: ^3.10.7
  csv: ^5.0.2
  share_plus: ^7.2.1
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.6
  drift_dev: ^2.14.0
  
  # App Launcher & Splash
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/launcher_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#16A34A"
  image: assets/splash_logo.png
  android_12:
    image: assets/splash_logo_android12.png
    color: "#16A34A"
    icon_background_color: "#16A34A"
  android: true
  ios: false
  web: false