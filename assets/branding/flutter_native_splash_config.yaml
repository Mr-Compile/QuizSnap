# Flutter Native Splash Configuration for QuizSnap
# Add this section to your pubspec.yaml

flutter_native_splash:
  # Light theme configuration
  color: "#FFFFFF"  # White background for light theme
  image: assets/branding/splash_light.png
  
  # Dark theme configuration
  color_dark: "#020617"  # slate950 background for dark theme
  image_dark: assets/branding/splash_dark.png
  
  # Android 12+ (Material You) configuration
  android_12:
    # The image parameter sets the splash screen icon image
    image: assets/branding/icon_foreground.png
    
    # Splash screen background color
    color: "#16A34A"  # bambooGreen600
    
    # The icon_background_color parameter sets the background color of the icon
    icon_background_color: "#16A34A"  # bambooGreen600
    
    # Android 12+ specific dark mode
    image_dark: assets/branding/icon_foreground.png
    color_dark: "#16A34A"  # bambooGreen600
    icon_background_color_dark: "#16A34A"  # bambooGreen600
  
  # Platform-specific settings
  android: true
  ios: false
  web: false
  
  # Additional settings
  fullscreen: false
  
  # Android specific
  android_gravity: center
  
  # iOS specific (when enabled)
  ios_content_mode: center

# Command to generate splash screens:
# dart run flutter_native_splash:create

# To remove splash screens (for cleanup):
# dart run flutter_native_splash:remove